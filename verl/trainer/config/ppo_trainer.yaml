# Format checks enforced on CI:
# 1. Comments must appear above each field.
# 2. There must be a blank line between each field.
# 3. Inline comments (after a field on the same line) are not allowed.
# 4. Indentation level is respected for nested fields.

# specify the default per-component configs
defaults:

  - model_engine: dp

  # <folder_name>@<field_name>.<field_name>: <yaml_file_name>
  # actor_rollout_ref.actor: trainer/config/actor/dp_actor.yaml
  - actor@actor_rollout_ref.actor: ${model_engine}_actor

  # data: trainer/config/data/legacy_data.yaml
  - data@data: legacy_data

  # Reference model config.
  # Reference model will be enabled when actor.use_kl_loss or/and algorithm.use_kl_in_reward is/are True.
  - ref@actor_rollout_ref.ref: ${model_engine}_ref

  # Rollout model config.
  - rollout@actor_rollout_ref.rollout: rollout

  # Model config.
  - model@actor_rollout_ref.model: hf_model

  # Critic model config.
  - critic@critic: ${model_engine}_critic
  - model@critic.model: hf_model

  # legacy reward impl config, for backward compatibility
  - legacy_reward_impl

  # Reward config.
  - reward@reward: reward

  # Rollout correction config.
  - algorithm@algorithm.rollout_correction: rollout_correction

  # distillation config
  - distillation@distillation: distillation

  # load the reference default config, then apply the fields in the current yaml
  # self config override anything above
  - _self_

# config for actor, rollout and reference model
actor_rollout_ref:

  # Whether it's a hybrid engine, currently only supports hybrid engine
  hybrid_engine: true

  # Timeout for operations executed against the process group
  nccl_timeout: 600

# config for the algorithm
algorithm:

  # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
  _target_: verl.trainer.config.AlgoConfig

  # Discount factor for future rewards
  gamma: 1.0

  # Trade-off between bias and variance in the GAE estimator
  lam: 1.0

  # Advantage estimator type: "gae", "grpo", "reinforce_plus_plus", etc.
  adv_estimator: gae

  # Whether to normalize advantages by std (specific to GRPO)
  norm_adv_by_std_in_grpo: True

  # Whether to enable in-reward KL penalty
  use_kl_in_reward: False

  # How to estimate KL divergence: "kl", "abs", "mse", "low_var_kl", or "full"
  kl_penalty: kl

  # KL control configuration
  kl_ctrl:

    # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
    _target_: verl.trainer.config.KLControlConfig

    # KL control type: "fixed" or "adaptive"
    type: fixed

    # Initial coefficient for KL penalty
    kl_coef: 0.001

    # Horizon value for adaptive controller (if enabled)
    horizon: 10000

    # Target KL divergence (used for adaptive controller)
    target_kl: 0.1

  # Whether to enable preference feedback PPO
  use_pf_ppo: False

  # Preference feedback PPO settings
  pf_ppo:

    # Method for reweighting samples: "pow", "max_min", or "max_random"
    reweight_method: pow

    # Power used for weight scaling in "pow" method
    weight_pow: 2.0

  # TTRL-OR custom sample-level MCTS + node-step GRPO loop.
  ttrl_or:

    # Enable the custom TTRL-OR fit loop inside RayPPOTrainer.fit.
    enable: False

    # Save per-sample logs under log_dir.
    save_logs: True

    # Log root for TTRL-OR artifacts.
    log_dir: null

    # MCTS-specific settings.
    mcts:

      # Maximum node-selection / rollout-update steps per sample.
      max_iterations: 20

      # PUCT exploration coefficient.
      c_puct: 1.414

      # Enable teacher-forcing prior for sibling action selection.
      enable_prior: True

      # Stop once a rollout achieves reward >= 1.0.
      # Keep this aligned with verl/trainer/ttrl_or_runtime/config.py default.
      stop_on_reward_one: False

      # Enable solverllm-style split completion flow.
      solverllm_compare_mode: False

      # Soft penalty weight for repeatedly selected sibling group (range: 0~1).
      blocked_sibling_soft_weight: 0.6

      # Whether to run CODE terminal refine when expanded_to_code is triggered.
      code_refine: True

      # CODE terminal repair rounds (0 means disabled).
      code_repair: 0

      # Enable cluster-linked backprop update in MCTS:
      # update same-cluster siblings and ancestor-layer same-cluster siblings.
      mcts_cluster_update: True

      # Legacy typo alias, fallback-only compatibility (prefer mcts_cluster_update).
      mcts_cluster_updata: null

    # Reward settings migrated from TTRL-OR.
    reward:

      # Code execution timeout in seconds.
      code_timeout_sec: 30

      # Gurobi optimize time limit in seconds, auto-injected by executor.
      gurobi_time_limit_sec: 30

      # Number of robustness cases per sample.
      robustness_cases: 3

      # Relative tolerance used by recent objective consensus checks.
      global_consensus_rel_tol: 0.005

      # Code executor mode: sandbox or subprocess.
      code_executor_mode: sandbox

      # Reward cluster scope: local or global.
      cluster_scope: local

      # R1 semantic cluster smoothing parameter.
      r1_alpha: 0.6

      # Minimum cluster denominator K for r1.
      r1_min_clusters: 3

      # Whether to use R3 robustness reward.
      enable_r3_reward: True

      # Whether to use R4 structural reward.
      enable_r4_reward: True

      # R4 structural cluster smoothing parameter.
      r4_alpha: 0.4

      # Normalization K used by r4.
      r4_k: 3

      # Historical decay used by r4 global bookkeeping.
      r4_decay: 0.95

      # Weight of r1 in final reward.
      r1_weight: 0.6

      # Weight of r2 in final reward.
      r2_weight: 0.1

      # Multiplier on r1 weight when objective scale check fails.
      r1_obj_scale_fail_multiplier: 0.2

      # Weight of r3 in final reward.
      r3_weight: 0.2

      # Weight of r4 in final reward.
      r4_weight: 0.1

      # Minimum multiplicative gate when LP structure is incomplete.
      structure_gate_min: 0.2

    # Dataset / preprocessing settings migrated from TTRL-OR.
    dataset:

      # Optional raw jsonl path override for standalone runtime usage.
      jsonl_path: ""

      # Optional multiple raw jsonl paths for sequential multi-dataset runs.
      jsonl_paths: []

      # Skip samples whose result.json already exists under the resolved log directory.
      resume_skip_completed: True

      # Optional dataset slicing controls for raw jsonl loading.
      start_index: 0
      limit: 0

      # Whether to randomly sample a subset from each dataset before running.
      sample_run: False

      # RNG seed used when sample_run is enabled.
      sample_seed: 0

      # Number of samples to draw from each dataset when sample_run is enabled.
      sample_size: 100

      # Max numeric features extracted from the raw OR sample.
      max_numeric_features: 256

      # Top-k key parameters tracked by the mapping extractor.
      key_param_top_k: 16

      # Mapping extractor mode for perturbation construction.
      mapping_extractor: rule

      # Optional mapping-LLM controls when an LLM extractor is used.
      mapping_llm_max_new_tokens: 1024
      mapping_llm_temperature: 0.0
      mapping_llm_top_p: 1.0

      # Auxiliary planner generation config for R3.
      r3_plan_max_new_tokens: 1536
      r3_plan_temperature: 0.2
      r3_plan_top_p: 0.95

    # Node-step GRPO generation config used by the migrated backend.
    grpo:

      # Optimizer learning rate mirrored into the runtime config.
      learning_rate: 5.0e-5

      # Alias of num_generations in GRPO literature.
      group_size: 3

      # KL penalty coefficient beta in the runtime config.
      kl_coef: 0.001

      # Whether to periodically refresh the KL reference model.
      sync_ref_model: false

      # Frequency for refreshing the KL reference model.
      ref_model_sync_steps: 5

      # Mixup factor when syncing the reference model.
      ref_model_mixup_alpha: 0.6

      # Number of train epochs inside one node-step update.
      train_epochs: 1

      # PPO/GRPO clip epsilon.
      clip_epsilon: 0.2

      # Optional high clip epsilon.
      clip_epsilon_high: null

      # Runtime per-device train batch size.
      per_device_train_batch_size: 1

      # Gradient accumulation steps.
      gradient_accumulation_steps: 1

      # Number of generations per prompt.
      num_generations: 3

      # Optional explicit generation batch size override.
      generation_batch_size: 0

      # Max prompt length per rollout.
      max_prompt_length: 10240

      # Max completion length per rollout.
      max_completion_length: 4096

      # Whether to use vLLM in standalone runtime mode.
      use_vllm: false

      # vLLM mode in standalone runtime usage.
      vllm_mode: server

      # vLLM memory utilization target.
      vllm_gpu_memory_utilization: 0.85

      # vLLM tensor parallel size.
      vllm_tensor_parallel_size: 1

      # vLLM max model length.
      vllm_max_model_len: 16384

      # vLLM max batched tokens.
      vllm_max_num_batched_tokens: 0

      # vLLM sleep mode flag.
      vllm_enable_sleep_mode: false

      # Whether to reset prefix cache after update.
      vllm_reset_prefix_cache_after_update: true

      # Whether to close communicator after update.
      vllm_close_communicator_after_update: true

      # Whether to disable vLLM fallback after fatal error.
      vllm_fallback_disable_on_error: true

    # Misc backend knobs for prompt/model interfacing.
    backend:

      # Runtime backend label.
      backend: trl

      # Optional standalone runtime model path override.
      model_name_or_path: ""

      # Random seed for standalone runtime usage.
      seed: 7

      # Fallback generation temperature used outside direct rollout calls.
      temperature: 0.8

      # Fallback top-p used outside direct rollout calls.
      top_p: 0.95

      # Fallback max_new_tokens used outside direct rollout calls.
      max_new_tokens: 4096

      # Torch dtype for standalone runtime usage.
      torch_dtype: auto

      # Whether to trust remote code for standalone runtime usage.
      trust_remote_code: false

      # LoRA rank mirrored into the standalone runtime config.
      lora_r: 8

      # LoRA alpha mirrored into the standalone runtime config.
      lora_alpha: 16

      # LoRA dropout mirrored into the standalone runtime config.
      lora_dropout: 0.05

      # LoRA bias mode mirrored into the standalone runtime config.
      lora_bias: none

      # LoRA target modules mirrored into the standalone runtime config.
      lora_target_modules:
        - q_proj
        - k_proj
        - v_proj
        - o_proj
        - gate_proj
        - up_proj
        - down_proj

      # Whether to reuse the base model across tasks in standalone runtime usage.
      reuse_base_model_across_tasks: true

      # Reset actor LoRA at each sample boundary so one sample maps to one episode-local adapter state.
      reset_lora_on_begin_episode: true

# config for the trainer
trainer:

  # Whether to balance batch sizes across distributed workers
  balance_batch: True

  # Number of epochs in training
  total_epochs: 30

  # Total training steps (can be set explicitly or derived from epochs)
  total_training_steps: null

  # Project name for experiment tracking (e.g., wandb)
  project_name: verl_examples

  # Experiment name for run identification in tracking tools
  experiment_name: gsm8k

  # Logging backends to use: "console", "wandb", etc.
  logger: ["console", "wandb"]

  # Number of generations to log during validation
  log_val_generations: 0

  # Directory for logging rollout data; no dump if null
  rollout_data_dir: null

  # Directory for logging validation data; no dump if null
  validation_data_dir: null

  # Number of nodes used in the training
  nnodes: 1

  # Number of GPUs per node
  n_gpus_per_node: 8

  # Save frequency (by iteration) for model checkpoints
  save_freq: -1

  # ESI refers to the elastic server instance used during training, similar to the training plan. For example,
  # if you purchase 10 hours of computing power, the ESI will automatically shut down after 10 hours of training.
  # To ensure a checkpoint is saved before ESI shuts down, the system will start saving a checkpoint in advance.
  # The advance time is calculated as: Advance Time = Longest historical step duration + Checkpoint save duration + esi_redundant_time.
  # Here, esi_redundant_time is a user-defined value that further extends the advance time for added safety.
  esi_redundant_time: 0

  # Resume mode: "auto", "disable", or "resume_path"
  # "auto": resume from last checkpoint if available
  # "disable": start from scratch
  # "resume_path": resume from a user-defined path
  resume_mode: auto

  # Path to resume training from (only used when resume_mode is "resume_path")
  resume_from_path: null

  # Whether to run validation before training begins
  val_before_train: True

  # Whether to run validation only
  val_only: False

  # Validation frequency (in training iterations)
  test_freq: -1

  # Number of iterations to warm up the critic before updating policy
  critic_warmup: 0

  # Default path to distributed filesystem for saving checkpoints
  default_hdfs_dir: null

  # Whether to delete local checkpoints after loading
  del_local_ckpt_after_load: False

  # Default local directory for saving checkpoints
  default_local_dir: checkpoints/${trainer.project_name}/${trainer.experiment_name}

  # Maximum number of actor checkpoints to keep
  max_actor_ckpt_to_keep: null

  # Maximum number of critic checkpoints to keep
  max_critic_ckpt_to_keep: null

  # Timeout (in seconds) for Ray worker to wait for registration
  ray_wait_register_center_timeout: 300

  # Device to run training on (e.g., "cuda", "cpu")
  device: cuda

  # whether to use legacy worker implementation
  #  mode: "auto", "enable", or "disable"
  use_legacy_worker_impl: disable

# data-level extensions used by the custom TTRL-OR dataset wrapper
data:

  # Custom dataset class used when routing PPO fit through TTRL-OR.
  custom_cls:
    path: null
    name: null

  # Max numeric features extracted from the raw OR jsonl sample.
  ttrl_or_max_numeric_features: 256

  # Top-k key parameters used by the mapping extractor.
  ttrl_or_key_param_top_k: 16

# profiler configs
global_profiler:

  # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
  _target_: verl.utils.profiler.ProfilerConfig

  # Profiling tool: choose between nsys, npu, torch, torch_memory, precision_debugger
  tool: null

  # profile steps
  steps: null

  # Whether to combine continuous steps into one database.
  ## If True, worker.profiler.discrete must be False, [1,2] in one, [5] in another.
  ## If False, [1] in one, [2] in another, [5] in another.
  profile_continuous_steps: False

  # Path to save profiling contents
  save_path: "outputs/profile"

  # Specific tool configs, can use +profiler.tool_config.[tool].xxx to config
  global_tool_config:

    # nsys config
    nsys:

      # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
      _target_: verl.utils.profiler.config.NsightToolConfig

      # True for each task has its own database, False for all tasks in one training step share one database.
      discrete: False

      # controller Nvidia Nsight Systems Options. Must set when profile_steps is not None.
      ## reference https://docs.nvidia.com/nsight-systems/UserGuide/index.html
      ## reference https://docs.ray.io/en/latest/ray-observability/user-guides/profiling.html
      controller_nsight_options:

        # Select the API(s) to be traced.
        trace: "cuda,nvtx,cublas,ucx"

        # Track the GPU memory usage by CUDA kernels. Must be string type "true" or "false".
        cuda-memory-usage: "true"

        # CUDA graphs will be traced as a whole
        cuda-graph-trace: "graph"

      # worker Nvidia Nsight Systems Options. Must set when profile_steps is not None.
      worker_nsight_options:

        # Select the API(s) to be traced.
        trace: "cuda,nvtx,cublas,ucx"

        # Track the GPU memory usage by CUDA kernels. Must be string type "true" or "false".
        cuda-memory-usage: "true"

        # CUDA graphs will be traced as a whole
        cuda-graph-trace: "graph"

        # Profiling only in a range of torch.cuda.profiler.start and stop. Do not change this config.
        capture-range: "cudaProfilerApi"

        # Specify the desired behavior when a capture range ends.
        # In verl we need the torch.cuda.profiler.start/stop pair to repeats n times.
        # valid values are "repeat-shutdown:n" or null.
        # For normal whole step profiling, n = len(profile_steps);
        # but for discrete profiling, n = len(profile_steps) * Number(subtasks).
        # Or you can just leave it null and the program will use n = len(profile_steps) * 6;
        capture-range-end: null

        # Send signal to the target application's process group. We let the program to exit by itself.
        kill: none

    # enable memory visualization for debugging memory usage
    torch_memory:

      #  Maximum number of allocation entries to record
      trace_alloc_max_entries: 100_000

      # The depth of the call stack to capture for each allocation
      stack_depth: 32

      # 'alloc': records only allocation events || 'state': records memory state changes || 'all': records both.
      context: "all"

      # 'python': records Python stacks || 'cpp': records C++ stacks (available in some versions) || 'all': records both.
      stacks: "all"

      # devices, record_context etc.
      kw_args: {}

    # msprobe precision debugger
    precision_debugger:

      # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
      _target_: verl.utils.profiler.config.PrecisionDebuggerToolConfig

      # Enable msprobe precision debugger
      enable: False

      # Path to msprobe config json
      config_path: null

      # Data directory for msprobe dumps
      data_dir: "outputs/precision_debug"

      # Profile steps
      steps: null

      # Profile stages
      # Supported stages: actor_update, actor_compute_log_prob, ref_compute_log_prob,
      # compute_values, critic_update, compute_rm_score
      stages: null

      # Whether to fail on unknown stage or missing msprobe
      strict: False

# configs for TransferQueue
transfer_queue:

  # Whether to enable transfer queue
  enable: False

# configs related to ray
ray_kwargs:

  # configs related to ray initialization
  ray_init:

    # Number of CPUs for Ray. Use a fixed number instead of null when using SLURM.
    num_cpus: null

  # Path to save Ray timeline JSON for performance profiling
  timeline_json_file: null

